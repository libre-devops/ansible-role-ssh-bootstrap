---
# Collections for development and tests. Users of the role need ansible.posix (for
# authorized_key), and community.general on SUSE hosts when ssh_bootstrap_install_server is
# true (ansible.builtin.package uses community.general.zypper there).
collections:
  - name: ansible.posix
    version: ">=1.6.0,<3.0.0"
  - name: community.general
    version: ">=10.0.0,<12.0.0"
  - name: containers.podman
    version: ">=1.16.0,<2.0.0"
